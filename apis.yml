  description: The Fleetmatics Reveal API - delivered through the Fleetmatics Integration
    Manager (FIM) / Reveal Integration Services - exposes REST endpoints for vehicles,
    drivers, real-time and historical GPS positions, trips and segments, driver
    status and safety, hours-of-service logbooks, geofences (places), groups, and
    non-powered asset tracking. Authentication exchanges Base64-encoded Reveal REST
    credentials for a short-lived bearer token; calls send an Atmosphere authorization
    header combining the app id and token. Access is gated to Reveal customers and
    approved integration partners. Now operated under Verizon Connect; see the
    verizon-connect repo for the fuller modeled API suite.
