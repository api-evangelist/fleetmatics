aid: fleetmatics
name: Fleetmatics
kind: company
description: 'Fleetmatics was a fleet management, telematics, and GPS vehicle tracking
  SaaS company whose Reveal platform tracked commercial vehicles, drivers, and mobile
  assets for small and mid-sized fleets. Founded in Dublin and later headquartered
  in Massachusetts, Fleetmatics IPO''d on the NYSE in 2012 and was acquired by Verizon
  in 2016 for about USD 2.4 billion, becoming the core of Verizon Connect. Its Reveal
  platform exposes a documented REST API and webhook suite - the Fleetmatics Integration
  Manager (FIM) / Reveal Integration Services APIs - covering vehicles, drivers, GPS
  positions and history, trips and segments, driver status and safety, hours-of-service
  logbooks, geofences (places), groups, and non-powered asset tracking. The API gateway
  still runs on Fleetmatics-branded hosts (fim.api.us.fleetmatics.com); access is gated
  to Reveal customers and approved integration partners who request Integration Manager
  and Reveal REST credentials before calling the documented endpoints. The Fleetmatics
  brand now redirects to Verizon Connect.'
